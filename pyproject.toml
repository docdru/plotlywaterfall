[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plotlywaterfall"
dynamic = ["version"]
description = "Plotly-express-style waterfall charts with groups, stacked categories, subtotals and custom colors."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["plotly", "waterfall", "chart", "finance", "cashflow", "visualization", "jupyter"]
authors = [
  { name = "Daniel Rüffer", email = "docdru.plotlywaterfall@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Framework :: Jupyter",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
]

[project.urls]
Homepage = "https://github.com/docdru/plotlywaterfall"
Source = "https://github.com/docdru/plotlywaterfall"
Issues = "https://github.com/docdru/plotlywaterfall/issues"
Changelog = "https://github.com/docdru/plotlywaterfall/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Development dependencies (PEP 735). `uv sync` installs the `dev` group.
# ---------------------------------------------------------------------------
[dependency-groups]
test = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
]
notebook = [
  "nbmake>=1.5",
  "ipykernel>=6.29",
]
lint = [
  "ruff>=0.16",
]
typing = [
  "mypy>=2.0",
  "pandas-stubs>=2.2",
]
dev = [
  { include-group = "test" },
  { include-group = "notebook" },
  { include-group = "lint" },
  { include-group = "typing" },
  "pre-commit>=4.0",
]

[tool.uv]
required-version = ">=0.11"
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[tool.hatch.version]
path = "src/plotlywaterfall/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plotlywaterfall"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "SIM",     # flake8-simplify
  "C4",      # flake8-comprehensions
  "PIE",     # flake8-pie
  "PT",      # flake8-pytest-style
  "NPY",     # numpy-specific rules
  "RUF",     # ruff-specific rules
]
ignore = [
  "E501",    # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C416", "RUF005"]  # explicit list building reads better in expected-value fixtures

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
# Tighten step by step: enable `disallow_untyped_defs = true` once the
# private helpers in waterfall.py carry type hints.

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests & coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "-ra",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
filterwarnings = [
  "error",
  # pandas/plotly internals may emit these on older/newer combinations
  "ignore::DeprecationWarning:plotly.*",
  "ignore::FutureWarning:plotly.*",
]

[tool.coverage.run]
source_pkgs = ["plotlywaterfall"]
branch = true
parallel = true
omit = ["src/plotlywaterfall/__about__.py"]

[tool.coverage.paths]
plotlywaterfall = ["src/plotlywaterfall", "*/site-packages/plotlywaterfall"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
