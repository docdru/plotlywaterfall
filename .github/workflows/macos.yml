name: macOS

# Informational: the tests on macOS, separate from CI and with their own README badge.
# Hosted macOS runners are sometimes not available for a long time; such a run is cancelled
# and must not turn CI red or block the docs deployment. This pure-Python package has no
# macOS-specific code paths, and CI already tests on Linux and Windows.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, with the CI run that catches breakage from new pandas / plotly / numpy releases
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    name: Test (py3.14, macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run tests with coverage
        run: >-
          uv run --locked --no-default-groups --group test
          pytest --cov --cov-report=term-missing
