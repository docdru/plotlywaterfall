name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run catches breakage from new pandas / plotly / numpy releases
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run --locked --only-group lint ruff check --output-format=github
      - name: Ruff format
        run: uv run --locked --only-group lint ruff format --check --diff
      - name: Workflow security audit (zizmor)
        run: uvx zizmor@1.32.0 --format=github .github/workflows

  typing:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: mypy
        run: uv run --locked --no-default-groups --group typing mypy

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # Windows always; macOS only on main / weekly / manual runs, because hosted macOS
        # runners often queue for minutes and this pure-Python package has no
        # macOS-specific code paths.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os": "windows-latest", "python-version": "3.14"}]'
          || '[{"os": "windows-latest", "python-version": "3.14"}, {"os": "macos-latest", "python-version": "3.14"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests with coverage
        run: >-
          uv run --locked --no-default-groups --group test
          pytest --cov --cov-report=term-missing
      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        shell: bash
        run: |
          {
            echo '### Coverage'
            echo '```'
            uv run --locked --no-default-groups --group test coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lowest-deps:
    name: Test (lowest supported dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Resolve lowest direct dependencies
        run: uv lock --upgrade --resolution lowest-direct
      - name: Show resolved versions
        run: uv tree --no-default-groups --group test --depth 1
      - name: Run tests
        # Old releases may emit deprecation warnings that newer ones fixed: show, don't fail
        run: >-
          uv run --no-default-groups --group test
          pytest -W default::DeprecationWarning -W default::FutureWarning

  prerelease-deps:
    name: Test (pre-release dependencies, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Early warning for upcoming pandas / plotly / numpy releases; not part of the merge gate
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: Resolve newest versions including pre-releases
        run: uv lock --upgrade --prerelease allow
      - name: Show resolved versions
        run: uv tree --no-default-groups --group test --depth 1
      - name: Run tests
        run: uv run --no-default-groups --group test pytest

  docs:
    name: Example notebook & docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # this job's output is published to GitHub Pages: no cache (avoids cache-poisoning)
          enable-cache: false
      - name: Execute the example notebook, render HTML and the README image
        # nbconvert and kaleido are only needed here and are not part of uv.lock
        run: >-
          uv run --locked --no-default-groups --group notebook
          --with "nbconvert>=7.16" --with "kaleido>=1.0"
          python scripts/build_docs.py --out site
      - name: Upload the site for review (download from the run's summary page)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - name: Summary
        shell: bash
        run: |
          {
            echo '### Docs site'
            echo "Rendered example notebook and README image: artifact **docs-site** of"
            echo "[this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "(open \`index.html\` after downloading). Published on GitHub Pages from main."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean environment
        shell: bash
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "from plotlywaterfall.waterfall import Waterfall; print('import ok')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Single required status check for branch protection
  all-green:
    name: All checks passed
    if: always()
    needs: [lint, typing, test, lowest-deps, docs, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::At least one required job did not succeed"
              exit 1
            fi
          done

  # Publish the docs site built by the docs job, only from main and only if everything passed.
  # One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: all-green
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
