name: Release

# One tag does everything: pushing a version tag (e.g. v1.3.0) builds the package with the
# version taken from the tag, publishes it to PyPI and creates the GitHub Release (notes from
# CHANGELOG.md, built files attached).
#
# Publishing a release in the GitHub UI with a new tag also pushes that tag, so it starts this
# workflow too; the existing release then keeps its notes and only gets the files.
#
# Uses PyPI Trusted Publishing (OIDC) – no API token is stored in the repository.
# One-time setup on pypi.org: Project → Settings → Publishing → add a GitHub
# publisher with workflow "release.yml" and environment "pypi".

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # no cache in release builds (avoids cache-poisoning)
          enable-cache: false
      - name: Build sdist and wheel with the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # the tag is the version: no dev or local suffix, whatever git describe would say
          export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION"
          uv build
          ls -l dist/
          # fails if the tag is not a normalized PEP 440 version (v1.3.0, v1.3.0rc1, ...)
          for f in "dist/plotlywaterfall-$VERSION.tar.gz" "dist/plotlywaterfall-$VERSION-py3-none-any.whl"; do
            [ -f "$f" ] || { echo "::error::Expected $f: is $TAG a valid version tag?"; exit 1; }
          done
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean environment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import plotlywaterfall, sys; v = plotlywaterfall.__version__; print(v); sys.exit(v != sys.argv[1])" \
            "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/plotlywaterfall/
    permissions:
      id-token: write # required for trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish (with attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach the built files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release, or attach the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists (created on GitHub): keeping its notes, attaching the files"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          python3 scripts/release_notes.py "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          args=(--title "$TAG" --verify-tag)
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            args+=(--generate-notes)
          fi
          case "$TAG" in
            *a[0-9]* | *b[0-9]* | *rc[0-9]* | *dev[0-9]*) args+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* "${args[@]}"
